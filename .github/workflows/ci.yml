name: ci

# Until now nothing checked a pull request — the only workflow ran on tags,
# so the first time code was tested by CI was after it had already been
# merged and tagged. That was survivable while releases were cut by hand;
# it isn't now that merging to main publishes a release on its own.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The launchd scheduler backend is written and maintained from Linux
      # machines (PRD §17), so nothing here would otherwise notice it
      # breaking. Vetting for Darwin is the cheapest guard against that.
      - name: vet (darwin)
        run: GOOS=darwin GOARCH=arm64 go vet ./...

      - name: test
        run: go test ./...

      - name: build every released platform
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null ./...
          done
