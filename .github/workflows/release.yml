name: release

# Every merge to main publishes a release. The version is worked out from
# the last tag rather than written down anywhere, so there is no file to
# forget to bump: patch by default, minor or major if the merge commit says
# so, and nothing at all if it says [skip release].
#
# One workflow does the whole job — compute, test, build, publish — on
# purpose, rather than pushing a tag and letting a tag-triggered workflow
# build it. That split is documented to fail (GitHub does not fire
# workflows for events pushed with the default GITHUB_TOKEN, so the tag
# would land and nothing would happen) and working around it needs a PAT.
#
# In practice the tag this workflow creates *did* re-trigger it, so that
# rule cannot be relied on in either direction: the version step checks for
# an existing release and exits cleanly instead.

on:
  push:
    branches: [main]
    # An explicitly pushed tag still releases exactly that version, so
    # cutting one by hand remains possible.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Two merges landing close together must not race to claim the same version
# number, so releases queue rather than run side by side. Only one run can
# be queued at a time, so a third arriving cancels the waiting one — merges
# in quick succession therefore coalesce into a single release rather than
# producing one each. That cancelled run is expected, not a failure: a
# release is a snapshot of main, so the next one carries the skipped
# commits too.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, or the next version can't be worked out

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Already released? Then there is nothing to do, and saying so is
          # not a failure. Creating a release also creates its tag, and that
          # tag push turns out to trigger this workflow a second time — the
          # rule that GITHUB_TOKEN-pushed events don't start workflows did
          # not hold for it in practice, and the duplicate run died on
          # "a release with the same tag name already exists". Re-running a
          # release by hand hits the same thing. Checking first turns both
          # into a clean no-op.
          already_released() {
            gh release view "$1" >/dev/null 2>&1
          }

          # A tag push means "release exactly this".
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if already_released "${GITHUB_REF_NAME}"; then
              echo "${GITHUB_REF_NAME} is already released; nothing to do"
              exit 0
            fi
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "releasing ${GITHUB_REF_NAME} (explicit tag)"
            exit 0
          fi

          # Markers are read from the first line only — for a squash merge,
          # the PR title. Scanning the whole message means any commit that
          # merely *discusses* a marker trips it, which is not hypothetical:
          # the commit that introduced this workflow described all three in
          # its body, and an earlier version of this step read "[major]" out
          # of that prose and would have cut a v1.0.0. A marker has to be a
          # deliberate, visible act, not a substring.
          subject="$(printf '%s\n' "$MESSAGE" | head -n1)"

          case "$subject" in
            *"[skip release]"*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "subject says [skip release]; not releasing"
              exit 0
              ;;
          esac

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          [ -n "$latest" ] || latest="v0.0.0"

          rest="${latest#v}"
          major="${rest%%.*}"; rest="${rest#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          patch="${patch%%-*}"   # ignore any pre-release suffix

          bump="${BUMP:-}"
          if [ -z "$bump" ]; then
            case "$subject" in
              *"[major]"*) bump=major ;;
              *"[minor]"*) bump=minor ;;
              *)           bump=patch ;;
            esac
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump '$bump'"; exit 1 ;;
          esac

          next="v${major}.${minor}.${patch}"
          if already_released "${next}"; then
            echo "${next} is already released; nothing to do"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::tag ${next} exists but has no release — a previous run half-finished"
            exit 1
          fi

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "${latest} + ${bump} -> ${next}"

      - name: Test
        if: steps.version.outputs.version != ''
        run: go test ./...

      - name: Build release binaries
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            out="dist/jobtail-${os}-${arch}"
            echo "building ${out}"
            # -trimpath drops the build machine's absolute paths from the
            # binary: a little smaller (~53 KB measured) and, more to the
            # point, the same source always produces the same bytes.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/jobtail
          done

      # Apple Silicon refuses to exec an unsigned binary — it is SIGKILLed
      # on launch, which looks exactly like jobtail crashing rather than
      # like a build problem. Go's linker ad-hoc signs darwin/arm64 even
      # when cross-compiling, but nothing would tell us if that stopped
      # being true, so check the Mach-O carries a signature before shipping
      # it. See PRD §17.
      - name: Check the macOS arm64 binary is code-signed
        if: steps.version.outputs.version != ''
        run: |
          python3 - <<'PY'
          import struct, sys
          path = "dist/jobtail-darwin-arm64"
          data = open(path, "rb").read()
          magic, _cpu, _sub, _ftype, ncmds, _sz, _fl, _r = struct.unpack_from("<IiiIIIII", data, 0)
          if magic != 0xfeedfacf:
              sys.exit(f"::error::{path} is not a 64-bit Mach-O (magic {magic:#x})")
          off, signed = 32, False
          for _ in range(ncmds):
              cmd, size = struct.unpack_from("<II", data, off)
              if cmd == 0x1d:  # LC_CODE_SIGNATURE
                  dataoff, _datasize = struct.unpack_from("<II", data, off + 8)
                  blob, = struct.unpack_from(">I", data, dataoff)
                  signed = blob == 0xfade0cc0  # CS_SuperBlob
              off += size
          if not signed:
              sys.exit(f"::error::{path} has no valid code signature; it would be "
                       "killed on launch on Apple Silicon")
          print(f"{path}: code signature present")
          PY

      - name: Create release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # gh creates the tag itself, at this exact commit.
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/jobtail-linux-amd64 \
            dist/jobtail-linux-arm64 \
            dist/jobtail-darwin-amd64 \
            dist/jobtail-darwin-arm64
